<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fable</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(180deg, #bfe4ff 0%, #e8f6ff 55%, #dff2d2 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #1f3a5f;
  }
  header {
    width: 100%;
    padding: 36px 16px 12px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: clamp(48px, 9vw, 96px);
    font-weight: 700;
    letter-spacing: 0.14em;
    line-height: 1;
    text-transform: lowercase;
    text-shadow: 0 3px 0 rgba(255,255,255,.8), 0 6px 18px rgba(31,58,95,.18);
  }
  header p {
    margin: 10px 0 0;
    font-size: 15px;
    letter-spacing: .3em;
    opacity: .7;
  }
  .stage {
    width: min(960px, 100% - 32px);
    margin: 8px 0 40px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(31,58,95,.18);
    background: #cfeaff;
  }
  svg { width: 100%; height: auto; display: block; }

  /* 背景视差 */
  .clouds  { animation: slide 38s linear infinite; }
  .hills   { animation: slide 14s linear infinite; }
  .bushes  { animation: slide 6s  linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-800px); } }

  /* 鹈鹕的小动作 */
  .wing-back {
    transform-box: fill-box; transform-origin: 90% 20%;
    animation: flap 1.6s ease-in-out infinite;
  }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  .head-group {
    transform-box: fill-box; transform-origin: 10% 90%;
    animation: nod 1.6s ease-in-out infinite;
  }
  @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }

  @media (prefers-reduced-motion: reduce) {
    .clouds, .hills, .bushes, .wing-back, .head-group { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>fable</h1>
  <p>一只鹈鹕的骑行</p>
</header>

<div class="stage">
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="34" ry="16" fill="#fff"/>
      <ellipse cx="-22" cy="6" rx="22" ry="12" fill="#fff"/>
      <ellipse cx="24" cy="6" rx="24" ry="13" fill="#fff"/>
      <ellipse cx="4" cy="-10" rx="20" ry="14" fill="#fff"/>
    </g>
    <g id="hillTile">
      <path d="M0 330 Q 100 250 200 320 T 400 310 T 600 330 T 800 330 L 800 420 L 0 420 Z" fill="#a9d98b"/>
      <path d="M0 360 Q 150 300 300 350 T 560 350 T 800 360 L 800 420 L 0 420 Z" fill="#8fcb72"/>
    </g>
    <g id="bushTile">
      <g fill="#5fa84f">
        <ellipse cx="60"  cy="392" rx="30" ry="14"/>
        <ellipse cx="90"  cy="388" rx="22" ry="12"/>
        <ellipse cx="330" cy="392" rx="26" ry="12"/>
        <ellipse cx="560" cy="390" rx="34" ry="15"/>
        <ellipse cx="590" cy="392" rx="20" ry="11"/>
        <ellipse cx="740" cy="392" rx="28" ry="13"/>
      </g>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="660" cy="95" r="90" fill="url(#sunGlow)"/>
  <circle cx="660" cy="95" r="40" fill="#ffd45c"/>

  <!-- 云 -->
  <g class="clouds" opacity=".95">
    <use href="#cloud" x="120" y="90"/>
    <use href="#cloud" x="380" y="60"  transform="scale(1)"/>
    <use href="#cloud" x="560" y="140"/>
    <use href="#cloud" x="920" y="90"/>
    <use href="#cloud" x="1180" y="60"/>
    <use href="#cloud" x="1360" y="140"/>
  </g>

  <!-- 远山 -->
  <g class="hills">
    <use href="#hillTile" x="0"/>
    <use href="#hillTile" x="800"/>
  </g>

  <!-- 草地 -->
  <rect y="398" width="800" height="102" fill="#7fbf5f"/>

  <!-- 灌木 -->
  <g class="bushes">
    <use href="#bushTile" x="0"/>
    <use href="#bushTile" x="800"/>
  </g>

  <!-- 路面 -->
  <rect y="395" width="800" height="26" fill="#5f6469"/>
  <line id="roadDash" x1="0" y1="408" x2="800" y2="408" stroke="#f3f3f3" stroke-width="3" stroke-dasharray="34 30"/>
  <rect y="419" width="800" height="4" fill="#4a4e52"/>

  <!-- 骑手 + 自行车（整体随蹬踏轻微起伏） -->
  <g id="rider">
    <!-- 影子 -->
    <ellipse cx="360" cy="418" rx="170" ry="7" fill="#000" opacity=".18"/>

    <!-- 远侧腿（在车架后面） -->
    <polyline id="legFar" points="280,242 300,290 330,335" fill="none" stroke="#d3872b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line id="footFar" x1="0" y1="0" x2="0" y2="0" stroke="#d3872b" stroke-width="7" stroke-linecap="round"/>

    <!-- 远侧曲柄与脚踏 -->
    <line id="crankFar" x1="330" y1="335" x2="330" y2="300" stroke="#3a3f44" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalFar" x="-10" y="-3" width="20" height="6" rx="2" fill="#2b2f33"/>

    <!-- 车轮 -->
    <g id="rearWheel" data-cx="250" data-cy="340">
      <circle cx="250" cy="340" r="60" fill="none" stroke="#222" stroke-width="11"/>
      <circle cx="250" cy="340" r="52" fill="none" stroke="#d9d9d9" stroke-width="4"/>
      <g class="spokes" stroke="#bbb" stroke-width="1.8"></g>
      <circle cx="250" cy="340" r="7" fill="#777" stroke="#333" stroke-width="2"/>
    </g>
    <g id="frontWheel" data-cx="470" data-cy="340">
      <circle cx="470" cy="340" r="60" fill="none" stroke="#222" stroke-width="11"/>
      <circle cx="470" cy="340" r="52" fill="none" stroke="#d9d9d9" stroke-width="4"/>
      <g class="spokes" stroke="#bbb" stroke-width="1.8"></g>
      <circle cx="470" cy="340" r="7" fill="#777" stroke="#333" stroke-width="2"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#d94a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="272" y1="245" x2="330" y2="335"/>   <!-- 座管 -->
      <line x1="250" y1="340" x2="330" y2="335"/>   <!-- 后下叉 -->
      <line x1="250" y1="340" x2="272" y2="245"/>   <!-- 后上叉 -->
      <line x1="272" y1="245" x2="432" y2="250"/>   <!-- 上管 -->
      <line x1="330" y1="335" x2="432" y2="250"/>   <!-- 下管 -->
      <line x1="432" y1="250" x2="447" y2="300"/>   <!-- 头管 -->
      <line x1="447" y1="300" x2="470" y2="340"/>   <!-- 前叉 -->
    </g>
    <!-- 车座 -->
    <line x1="272" y1="245" x2="272" y2="232" stroke="#3a3f44" stroke-width="6"/>
    <rect x="248" y="226" width="46" height="10" rx="5" fill="#2b2f33"/>
    <!-- 车把 -->
    <line x1="432" y1="250" x2="440" y2="232" stroke="#3a3f44" stroke-width="6" stroke-linecap="round"/>
    <path d="M 426 232 L 454 232 Q 462 232 464 240" fill="none" stroke="#2b2f33" stroke-width="7" stroke-linecap="round"/>
    <!-- 车铃 -->
    <circle cx="446" cy="226" r="5" fill="#ffd45c" stroke="#b08a20" stroke-width="1.5"/>

    <!-- 链条、牙盘、飞轮 -->
    <circle cx="250" cy="340" r="9" fill="none" stroke="#444" stroke-width="4"/>
    <circle cx="330" cy="335" r="22" fill="none" stroke="#444" stroke-width="5"/>
    <path id="chain" d="M 330 313 L 250 331 A 9 9 0 0 0 250 349 L 330 357 A 22 22 0 0 0 330 313 Z"
          fill="none" stroke="#222" stroke-width="3" stroke-dasharray="4 3"/>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 尾羽 -->
    <g fill="#f4f4f4" stroke="#333" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 245 210 L 200 196 L 236 220 Z"/>
      <path d="M 243 218 L 196 216 L 238 228 Z"/>
      <path d="M 241 226 L 202 238 L 240 236 Z"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="292" cy="214" rx="60" ry="38" fill="#fff" stroke="#333" stroke-width="3"/>
    <!-- 后翅（轻轻扇动） -->
    <path class="wing-back" d="M 322 196 Q 262 178 238 226 Q 278 246 328 226 Z" fill="#ececec" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 脖子 -->
    <path d="M 322 196 C 332 172 344 152 366 126" fill="none" stroke="#333" stroke-width="30" stroke-linecap="round"/>
    <path d="M 322 196 C 332 172 344 152 366 126" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
    <!-- 头 + 喙 -->
    <g class="head-group">
      <!-- 喉囊 -->
      <path d="M 384 124 Q 430 186 488 140 L 386 118 Z" fill="#f6b98a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 上喙 -->
      <path d="M 382 108 L 492 136 L 384 124 Z" fill="#f7a33a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="386" y1="116" x2="486" y2="135" stroke="#c97a1c" stroke-width="1.5" opacity=".7"/>
      <!-- 头 -->
      <circle cx="370" cy="118" r="21" fill="#fff" stroke="#333" stroke-width="3"/>
      <!-- 头顶小羽 -->
      <path d="M 358 100 Q 352 86 362 88 Q 356 78 368 84 Q 366 76 374 84" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="378" cy="112" r="5" fill="#fff" stroke="#333" stroke-width="2"/>
      <circle cx="379.5" cy="112.5" r="2.4" fill="#222"/>
      <circle cx="380.5" cy="111" r=".9" fill="#fff"/>
    </g>
    <!-- 前翅：伸向车把 -->
    <path d="M 316 192 Q 380 200 434 236 Q 384 226 318 216 Z" fill="#f9f9f9" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="436" cy="235" r="6" fill="#f7a33a" stroke="#333" stroke-width="2"/>

    <!-- 近侧腿 -->
    <polyline id="legNear" points="280,242 300,290 330,335" fill="none" stroke="#f7a33a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <line id="footNear" x1="0" y1="0" x2="0" y2="0" stroke="#f7a33a" stroke-width="8" stroke-linecap="round"/>

    <!-- 近侧曲柄与脚踏 -->
    <line id="crankNear" x1="330" y1="335" x2="330" y2="370" stroke="#3a3f44" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalNear" x="-10" y="-3" width="20" height="6" rx="2" fill="#2b2f33"/>
  </g>
</svg>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // 几何常量
  const BB   = { x: 330, y: 335 };   // 中轴
  const HIP  = { x: 280, y: 242 };   // 髋关节
  const CRANK = 35;                  // 曲柄长度
  const L1 = 72, L2 = 72;            // 大腿 / 小腿
  const WHEEL_R = 60;
  const GEAR = 22 / 9;               // 牙盘 / 飞轮 齿比
  const CADENCE = 2 * Math.PI / 1.6; // 每 1.6 秒蹬一圈

  // 生成辐条
  document.querySelectorAll('.spokes').forEach(g => {
    const wheel = g.parentElement;
    const cx = +wheel.dataset.cx, cy = +wheel.dataset.cy;
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2;
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', cx); l.setAttribute('y1', cy);
      l.setAttribute('x2', cx + 52 * Math.cos(a));
      l.setAttribute('y2', cy + 52 * Math.sin(a));
      g.appendChild(l);
    }
  });

  const el = {
    rider: $('rider'),
    rearWheel: $('rearWheel'), frontWheel: $('frontWheel'),
    chain: $('chain'), road: $('roadDash'),
    legFar: $('legFar'), legNear: $('legNear'),
    footFar: $('footFar'), footNear: $('footNear'),
    crankFar: $('crankFar'), crankNear: $('crankNear'),
    pedalFar: $('pedalFar'), pedalNear: $('pedalNear'),
  };

  // 两段式反向运动学：由髋关节与脚的位置求膝盖
  function solveKnee(F) {
    const dx = F.x - HIP.x, dy = F.y - HIP.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1 + L2 - 0.5);
    const base = Math.atan2(dy, dx);
    const a1 = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const ang = base - a1;                     // 膝盖朝前（画面右侧）
    return { x: HIP.x + L1 * Math.cos(ang), y: HIP.y + L1 * Math.sin(ang) };
  }

  function placeLeg(angle, leg, foot, crank, pedal) {
    const P = { x: BB.x + CRANK * Math.cos(angle), y: BB.y + CRANK * Math.sin(angle) };
    const K = solveKnee(P);
    leg.setAttribute('points', `${HIP.x},${HIP.y} ${K.x.toFixed(1)},${K.y.toFixed(1)} ${P.x.toFixed(1)},${P.y.toFixed(1)}`);
    crank.setAttribute('x2', P.x.toFixed(1));
    crank.setAttribute('y2', P.y.toFixed(1));
    pedal.setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)})`);
    // 蹼足：贴着脚踏，前长后短
    foot.setAttribute('x1', (P.x - 9).toFixed(1));  foot.setAttribute('y1', (P.y - 4).toFixed(1));
    foot.setAttribute('x2', (P.x + 15).toFixed(1)); foot.setAttribute('y2', (P.y - 4).toFixed(1));
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let crank = 0, last = performance.now(), roadOffset = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!reduce) crank += dt * CADENCE;

    const crankDeg = crank * 180 / Math.PI;
    const wheelDeg = crankDeg * GEAR;

    el.rearWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 250 340)`);
    el.frontWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 470 340)`);

    // 链条与路面按线速度滚动
    el.chain.style.strokeDashoffset = (crank * 22).toFixed(1);
    roadOffset += dt * (wheelDeg ? (CADENCE * GEAR * WHEEL_R) : 0);
    if (reduce) roadOffset = 0;
    el.road.style.strokeDashoffset = roadOffset.toFixed(1);

    // 腿：近侧与远侧相差 180°
    placeLeg(crank, el.legNear, el.footNear, el.crankNear, el.pedalNear);
    placeLeg(crank + Math.PI, el.legFar, el.footFar, el.crankFar, el.pedalFar);

    // 整车轻微起伏
    const bob = Math.sin(crank * 2) * 1.8;
    el.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
